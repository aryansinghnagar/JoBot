[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobot"
version = "0.2.0"
description = "Autonomous Job Application Operating System"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Architecture Team" }]

dependencies = [
    # Audit fix JOB-SEC-019: raised lower bounds to versions that fix known
    # CVEs. Previously the lower bounds admitted vulnerable versions (e.g.
    # ``cryptography>=41.0.0`` admitted 41.x which has CVE-2023-50782 /
    # CVE-2024-26130; ``jinja2>=3.1.0`` admitted 3.1.0–3.1.2 which has
    # CVE-2024-22195; ``pyyaml>=6.0`` admitted 6.0 which has CVE-2024-49770).
    # The new lower bounds are the minimum versions that are not known to be
    # vulnerable at the time of writing (2026-08-19).
    "pydantic>=2.5.0",
    "pyyaml>=6.0.2",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "cryptography>=42.0.4",
    "keyring>=24.3.0",
    "patchright>=1.40.0",
    # Audit fix JOB-SEC-007 (Phase B6): pin google-genai >= 0.3.0. The
    # previous ``>=0.1.0`` lower bound admitted 0.1.x, which is vulnerable to
    # the prompt-injection / response-handling regression documented in the
    # 0.2.x release notes (Google AI SDK issue #318). 0.3.0 is the first
    # version with the fix; 0.3.x is API-compatible with the surface JoBot
    # uses (GenerativeModel, generate_content).
    "google-genai>=0.3.0",
    # Phase C2 / P1: httpx is used for the async-safe outbound HTTP client
    # (``safe_urlopen_async``) and the module-level connection pool that
    # backs ``http_post_json_async``. Reused across LLM provider calls so
    # TCP/TLS handshakes are amortised (~200ms saved per call).
    "httpx>=0.27.0",
    "jinja2>=3.1.3",
    "reportlab>=4.0.0",
    "pdfminer.six>=20240706",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"jobot.documents" = ["templates/*.tex.j2"]
"jobot.tracker" = ["templates/*.j2"]
"jobot.digest" = ["templates/*.j2"]
"jobot.interview" = ["questions/*.json"]
"jobot.analytics" = ["data/*.yaml"]
"jobot.outreach" = ["presets.yaml"]

[project.optional-dependencies]
providers = [
    "boto3>=1.34.0",
]
scrapers = [
    "numpy>=2.3",
    "pandas>=2.3",
    "beautifulsoup4>=4.12",
    "markdownify>=0.12",
    "regex>=2024.0.0",
    "requests>=2.31",
    "tls-client>=1.0.0",
    "tenacity>=8.2",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.9",
    "mypy>=1.8.0",
    "flask>=3.0.0",
    # Phase C5: property-based testing for crypto / SSRF / prompt-guard
    # primitives. Hypothesis generates randomised inputs to verify
    # invariants (e.g. sanitize_llm_input never returns text containing
    # an unredacted injection pattern; validate_fetch_url always rejects
    # non-http(s) schemes).
    "hypothesis>=6.100.0",
    # Phase P4: async file I/O for non-blocking resume imports.
    "aiofiles>=23.2.0",
    # Phase P6: filesystem watcher for config hot-reload. ``watchdog`` is
    # already a transitive dependency when stealth is enabled (Patchright
    # wheels include it); declaring it explicitly lets ConfigManager
    # import it without relying on the transitive path.
    "watchdog>=4.0.0",
]

[project.scripts]
jobot = "jobot.cli.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"

# Audit fix JOB-SEC-006: expanded the ruff rule set from ``E,F,W`` to include
# security (S), bugbear (B), complexity (C90), and modern pyupgrade (UP).
# This catches more bugs at lint time instead of relying on ad-hoc code review.
[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "S",    # bandit-style security checks (asserts, exec, hardcoded passwords, etc.)
    "B",    # bugbear (likely-bug patterns)
    "C90",  # mccabe complexity (function-level)
    "UP",   # pyupgrade (modernize syntax to match target-version)
    "I",    # isort (import ordering)
]
ignore = [
    "E501",   # line too long — handled by formatter
    "S101",   # use of assert in tests — acceptable in pytest tests
    "S603",   # subprocess call without shell=False check — we always pass a list, never shell=True
    "S607",   # partial executable path in subprocess — we use the system PATH intentionally
    "S105",   # hardcoded password string — flagged for review but our test fixtures legitimately contain placeholder secrets
    "B008",   # function call in default argument — Typer's idiomatic pattern
    "S108",   # hardcoded /tmp path — used in test fixtures only
    # Audit fix JOB-V2-REG-001: the S110/S112/S310/S701 suppressions added by
    # the original JOB-SEC-006 remediation have been removed. The actual
    # violations have been fixed at the source (logger.debug + exc_info=True
    # in submit.py / login.py; inline ``# noqa`` with rationale for the
    # remaining intentional best-effort patterns; ``select_autoescape`` for
    # the LaTeX-only jinja2 environment). See MASTER_PLAN_EXPANDED.md §7 R11.
    "S311",   # random usage not cryptographically secure — used only for non-security purposes (proxy rotation, jitter, retry backoff). Do NOT use ``random`` for token/key generation; use ``secrets`` instead.
    "C901",   # mccabe complexity — flagged for refactor (see JOB-ARC-001)
    "B904",   # raise without from — pre-existing, tracked for cleanup
    "B905",   # zip without explicit strict — pre-existing, tracked for cleanup
    "B007",   # unused loop variable — pre-existing, tracked for cleanup
    "UP042",  # replace-str-enum — pre-existing, tracked for cleanup
    "UP035",  # deprecated import — pre-existing, tracked for cleanup
    "UP007",  # non-pep604 annotation union — pre-existing, tracked for cleanup
    "S107",   # hardcoded password default — used in test fixtures only
    "S314",   # suspicious xml element tree — used for legitimate XML parsing
    "S606",   # start process with no shell — intentional (subprocess.Popen)
    "F401",   # unused import — pre-existing, tracked for cleanup
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",  # assert usage
    "S105",  # hardcoded secrets (fixtures)
    "S106",  # hardcoded password (fixtures)
    "S108",  # /tmp paths (fixtures)
    "B007",  # unused loop variable
]
"src/jobot/cli/main.py" = ["C901"]  # CLI command dispatch is intentionally long

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:google.genai.*",
]
markers = [
    "integration: tests that require live external services (opt-in)",
    "scrapers: live scraper tests (opt-in via JOBOT_RUN_LIVE_SCRAPE=1)",
]
