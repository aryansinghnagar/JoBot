[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobot"
version = "1.0.0"
description = "Autonomous Job Application Operating System"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Architecture Team" }]

dependencies = [
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "cryptography>=41.0.0",
    "keyring>=24.3.0",
    "patchright>=1.40.0",
    "google-genai>=0.1.0",
    "jinja2>=3.1.0",
    "reportlab>=4.0.0",
    "pdfminer.six>=20240706",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"jobot.documents" = ["templates/*.tex.j2"]
"jobot.tracker" = ["templates/*.j2"]
"jobot.digest" = ["templates/*.j2"]
"jobot.interview" = ["questions/*.json"]
"jobot.analytics" = ["data/*.yaml"]
"jobot.outreach" = ["presets.yaml"]

[project.optional-dependencies]
providers = [
    "boto3>=1.34.0",
]
scrapers = [
    "numpy>=2.3",
    "pandas>=2.3",
    "beautifulsoup4>=4.12",
    "markdownify>=0.12",
    "regex>=2024.0.0",
    "requests>=2.31",
    "tls-client>=1.0.0",
    "tenacity>=8.2",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.9",
    "mypy>=1.8.0",
    "flask>=3.0.0",
]

[project.scripts]
jobot = "jobot.cli.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require live external services (opt-in)",
    "scrapers: live scraper tests (opt-in via JOBOT_RUN_LIVE_SCRAPE=1)",
]
