[package]
name = "jobot-gui"
version = "1.0.0"
description = "JoBot Desktop GUI (Tauri 2 shell over the jobot stdio sidecar)"
authors = ["Aryan"]
edition = "2021"

[lib]
name = "jobot_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true