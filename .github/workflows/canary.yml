name: Nightly Live Canary Test Suite

on:
  schedule:
    # Run nightly at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary-audit:
    name: Live Portal & ATS Canary Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Hermetic ATS Test Suite
        run: |
          python -m pytest tests/test_cxs_adapters.py tests/test_no_fake_submission.py tests/test_prompt_injection.py tests/test_sidecar.py -v

      - name: Run Doctor Environment Diagnostic
        run: |
          python -m jobot.cli.main doctor
