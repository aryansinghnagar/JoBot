name: Security Gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-deps:
    name: Python Dependency Audit (pip-audit)
    runs-on: ubuntu-latest

    steps:
      # v4.4.0 (SHA-pinned)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        # v5.6.0 (SHA-pinned)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Audit runtime dependencies
        # Installs only the required runtime dependency set (dev extras are
        # intentionally excluded so tooling vulnerabilities do not gate the
        # runtime supply chain), then audits the resulting environment.
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install .
          python -c "import subprocess, sys; out = subprocess.check_output([sys.executable, '-m', 'pip', 'freeze'], text=True); reqs = [line for line in out.splitlines() if not line.lower().startswith('jobot')]; open('runtime-reqs.txt', 'w').write('\n'.join(reqs))"
          pip-audit -r runtime-reqs.txt --strict

  js-audit:
    name: JavaScript Dependency Audit (npm audit)
    runs-on: ubuntu-latest

    steps:
      # v4.4.0 (SHA-pinned)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        # v4.4.0 (SHA-pinned)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        # Fails the job on any high or critical advisory; no continue-on-error.
        run: npm audit --audit-level=high

  secrets:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest

    steps:
      # Full history is required so gitleaks can scan all commits.
      # v4.4.0 (SHA-pinned)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets
        # v3.0.0 (SHA-pinned)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
