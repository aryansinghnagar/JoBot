name: Dual-Stack Continuous Integration

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  pip-quality:
    name: Python Quality & Test Suite (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install ruff black pytest-cov mypy
          pip install -e .[dev]

      - name: Run Ruff Linting Check
        run: |
          ruff check src/ --select E,F --ignore E501,F401

      - name: Verify Code Formatting
        run: |
          ruff format --check src/

      - name: Run Mypy Type Checking
        run: |
          mypy src/ --ignore-missing-imports

      - name: Run Pytest Suite with Coverage Check
        run: |
          python -m pytest -v --cov=jobot --cov-report=term-missing

  npm-quality:
    name: Node.js Quality & Test Suite (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ["18", "20"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install Node Modules
        run: npm ci

      - name: Run Prettier Formatter / Linter Check
        run: npm run lint

      - name: Run Vitest Unit Test Suite
        run: npm run test

  supply-chain:
    name: Supply Chain — SBOM + Provenance Attestation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate Python SBOM (CycloneDX)
        run: |
          pip install cyclonedx-bom
          cyclonedx-py environment --output sbom-python.json

      - name: Generate Node SBOM (CycloneDX)
        run: |
          npm install --no-save @cyclonedx/cyclonedx-npm
          npx @cyclonedx/cyclonedx-npm --output-file sbom-node.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: |
            sbom-python.json
            sbom-node.json

      - name: Attest SBOM Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            sbom-python.json
            sbom-node.json
