name: Dual-Stack Continuous Integration

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  pip-quality:
    name: Python Quality & Test Suite (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      # v4.4.0 (SHA-pinned)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        # v5.6.0 (SHA-pinned)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install ruff pytest-cov mypy
          pip install -e .[dev]

      - name: Run Ruff Linting Check
        # Ruff's configured defaults apply (pyproject sets line-length 100, target py311).
        run: |
          ruff check src/

      - name: Verify Code Formatting
        run: |
          ruff format --check src/

      - name: Run Mypy Type Checking
        run: |
          mypy src/ --ignore-missing-imports

      - name: Run Pytest Suite with Coverage Check
        run: |
          python -m pytest -v --cov=jobot --cov-report=term-missing

  npm-quality:
    name: Node.js Quality & Test Suite (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ["20", "22"]

    steps:
      # v4.4.0 (SHA-pinned)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        # v4.4.0 (SHA-pinned)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install Node Modules
        run: npm ci

      - name: Run Prettier Formatter / Linter Check
        run: npm run lint

      - name: Run Vitest Unit Test Suite
        run: npm run test

  supply-chain:
    name: Supply Chain — SBOM + Provenance Attestation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      # v4.4.0 (SHA-pinned)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        # v5.6.0 (SHA-pinned)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Node.js
        # v4.4.0 (SHA-pinned)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Generate Python SBOM (CycloneDX)
        run: |
          pip install cyclonedx-bom
          cyclonedx-py environment --output sbom-python.json

      - name: Generate Node SBOM (CycloneDX)
        run: |
          npm install --no-save @cyclonedx/cyclonedx-npm
          npx @cyclonedx/cyclonedx-npm --output-file sbom-node.json

      - name: Upload SBOMs
        # v4.6.2 (SHA-pinned)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sboms
          path: |
            sbom-python.json
            sbom-node.json

      - name: Attest SBOM Provenance
        # v2.4.0 (SHA-pinned)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: |
            sbom-python.json
            sbom-node.json
