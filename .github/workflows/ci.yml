name: Dual-Stack Continuous Integration

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  pip-quality:
    name: Python Quality & Test Suite (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      # v4.4.0 (SHA-pinned)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        # v5.6.0 (SHA-pinned)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install ruff pytest-cov mypy
          pip install -e .[dev]

      - name: Run Ruff Linting Check
        # Ruff's configured defaults apply (pyproject sets line-length 100, target py311).
        run: |
          ruff check src/

      - name: Verify Code Formatting
        run: |
          ruff format --check src/

      - name: Run Mypy Type Checking
        run: |
          mypy src/ --ignore-missing-imports

      - name: Run Pytest Suite with Coverage Check
        run: |
          python -m pytest -v --cov=jobot --cov-report=term-missing

  npm-quality:
    name: Node.js Quality & Test Suite (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ["20", "22"]

    steps:
      # v4.4.0 (SHA-pinned)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        # v4.4.0 (SHA-pinned)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install Node Modules
        run: npm ci

      - name: Run Prettier Formatter / Linter Check
        run: npm run lint

      - name: Run Vitest Unit Test Suite
        run: npm run test

  supply-chain:
    name: Supply Chain — SBOM + Provenance Attestation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      # v4.4.0 (SHA-pinned)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        # v5.6.0 (SHA-pinned)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Set up Node.js
        # v4.4.0 (SHA-pinned)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"

      # Audit fix JOB-ARC-010: version-sync check in CI. Fails the build if
      # pyproject.toml, package.json, gui/package.json, tauri.conf.json, or
      # Cargo.toml drift out of sync. The canonical source is pyproject.toml.
      - name: Verify Version Sync Across Manifests
        run: |
          python scripts/sync_versions.py --check

      - name: Generate Python SBOM (CycloneDX)
        run: |
          pip install cyclonedx-bom
          cyclonedx-py environment --output-file sbom-python.json

      - name: Generate Node SBOM (CycloneDX)
        run: |
          npm install --no-save @cyclonedx/cyclonedx-npm
          npx @cyclonedx/cyclonedx-npm --output-file sbom-node.json

      - name: Upload SBOMs
        # v4.6.2 (SHA-pinned)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sboms
          path: |
            sbom-python.json
            sbom-node.json

      - name: Attest SBOM Provenance
        # v2.4.0 (SHA-pinned)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            sbom-python.json
            sbom-node.json

  docs-lint:
    # Audit fix JOB-V2-NEW-007 (docs-lint CI step): the post-remediation v2
    # audit (scripts/jobot_audit_v2.md) found 5+ dangling section references
    # in MASTER_PLAN_EXPANDED.md (§3.4, §9.2, §12.5, §13.2 were cited but did
    # not exist as sections) plus two wrong section numbers in SECURITY.md.
    # This job runs two cheap static checks to keep that class of drift out
    # of the repo going forward.
    name: Docs Lint — Version Sync + MASTER_PLAN Citations
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # v4.4.0 (SHA-pinned)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        # v5.6.0 (SHA-pinned)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Verify Version Sync Across Manifests
        # Re-uses the supply-chain job's check so a PR cannot merge with
        # version drift even if the heavier SBOM/provenance step is skipped.
        run: |
          python scripts/sync_versions.py --check

      - name: Verify MASTER_PLAN Citations Resolve
        # Parses MASTER_PLAN_EXPANDED.md for the set of defined section IDs
        # (## Section N + ### N.M) and greps the repo (src/, tests/, *.md)
        # for "MASTER_PLAN_EXPANDED.md §N.M" / "Section N" citations. Fails
        # if any cited section is not defined in the document.
        run: |
          python scripts/check_master_plan_citations.py
