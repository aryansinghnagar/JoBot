name: Dual-Stack Continuous Integration

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  pip-quality:
    name: Python Quality & Test Suite (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install ruff black pytest-cov mypy

      - name: Run Ruff Linting Check
        run: |
          ruff check .

      - name: Verify Black Code Formatting
        run: |
          black --check .

      - name: Run Mypy Type Checking
        run: |
          mypy src/

      - name: Run Pytest Suite with Coverage Check
        run: |
          pytest -v --cov=jobot --cov-report=term-missing

  npm-quality:
    name: Node.js Quality & Test Suite (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ["18", "20"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install Node Modules
        run: npm ci

      - name: Run Prettier Formatter / Linter Check
        run: npm run lint

      - name: Run Vitest Unit Test Suite
        run: npm run test
